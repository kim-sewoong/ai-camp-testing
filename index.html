<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘 뭐 입지?</title>
<meta name="description" content="기상청 실시간 날씨로 오늘 출근 코디를 추천해 드려요">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧥</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f2ee; --surface:#ffffff; --ink:#1b1a18; --muted:#6e6a62; --line:#e7e3da; --chip:#efebe4;
  --hue:30; /* 기온에 따라 JS가 바꿈: 추우면 파랑, 더우면 주황 */
  --tone:hsl(var(--hue) 85% 52%); --tone-soft:hsl(var(--hue) 90% 95%); --tone-ink:hsl(var(--hue) 70% 28%);
  --shadow:0 1px 2px rgba(0,0,0,.04),0 10px 30px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#131312; --surface:#1d1c1a; --ink:#f2efe9; --muted:#a39e94; --line:#2e2c29; --chip:#292825;
  --tone-soft:hsl(var(--hue) 35% 17%); --tone-ink:hsl(var(--hue) 85% 78%); --shadow:none;
}}
:root[data-theme="dark"]{
  --bg:#131312; --surface:#1d1c1a; --ink:#f2efe9; --muted:#a39e94; --line:#2e2c29; --chip:#292825;
  --tone-soft:hsl(var(--hue) 35% 17%); --tone-ink:hsl(var(--hue) 85% 78%); --shadow:none;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:960px;margin:0 auto;padding:24px 16px 64px}
button{font:inherit;color:inherit;cursor:pointer}

/* 상단 */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{font-weight:900;font-size:22px;letter-spacing:-.03em}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;background:var(--chip);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:9px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.loc{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 12px;font-size:14px;font-weight:500}

/* 히어로 */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:16px;margin-bottom:16px}
@media (max-width:720px){.hero{grid-template-columns:1fr}}
.card{background:var(--surface);border-radius:20px;padding:22px;box-shadow:var(--shadow);border:1px solid var(--line)}
.weather{background:linear-gradient(160deg,var(--tone-soft),var(--surface) 70%)}
.place{font-size:13px;color:var(--muted);font-weight:500}
.big{display:flex;align-items:center;gap:14px;margin:6px 0 2px}
.big .icon{font-size:56px;line-height:1}
.big .temp{font-size:64px;font-weight:900;letter-spacing:-.04em;line-height:1}
.big .temp small{font-size:28px;font-weight:700}
.desc{font-size:15px;color:var(--muted)}
.range{display:flex;gap:14px;margin-top:14px;font-size:14px}
.range b{font-size:18px}
.lo b{color:hsl(215 75% 52%)} .hi b{color:hsl(12 80% 52%)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.stat{background:var(--chip);border-radius:12px;padding:8px 10px;font-size:12px;color:var(--muted)}
.stat b{display:block;font-size:15px;color:var(--ink)}

.outfit h2{margin:0 0 4px;font-size:13px;color:var(--tone-ink);font-weight:700;letter-spacing:.02em}
.headline{font-size:22px;font-weight:900;letter-spacing:-.03em;margin:0 0 6px;line-height:1.35}
.summary{font-size:14px;color:var(--muted);margin:0 0 16px}
.items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:480px){.items{grid-template-columns:1fr}.moment .t{font-size:20px}}
.item{display:flex;gap:12px;align-items:center;background:var(--tone-soft);border-radius:14px;padding:12px}
.item .e{font-size:30px;line-height:1;flex:none}
.item .k{font-size:12px;color:var(--tone-ink);font-weight:700}
.item .v{font-size:15px;font-weight:700}

/* 체크리스트 */
.tips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.tip{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:14px}
.tip.warn{border-color:var(--tone);background:var(--tone-soft)}
.tip b{font-weight:700}

/* 출근/점심/퇴근 */
.sec-title{font-size:15px;font-weight:700;margin:22px 0 10px}
.moments{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.moment{text-align:center;padding:16px 10px}
.moment .when{font-size:13px;color:var(--muted);font-weight:500}
.moment .e{font-size:30px;margin:4px 0}
.moment .t{font-size:24px;font-weight:900;letter-spacing:-.03em}
.moment .f{font-size:12px;color:var(--muted)}

/* 시간별 */
.hourly{display:flex;gap:6px;overflow-x:auto;padding:14px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.h{flex:none;width:58px;text-align:center;font-size:12px;color:var(--muted);border-radius:12px;padding:8px 0}
.h.now{background:var(--tone-soft);color:var(--ink)}
.h .e{font-size:20px;margin:2px 0}
.h .t{font-size:15px;font-weight:700;color:var(--ink)}
.h .p{color:hsl(210 80% 50%);font-weight:500;min-height:18px}

/* 가이드 */
.guide{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.g{border-radius:12px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);font-size:13px}
.g b{display:block;font-size:14px}
.g.on{border:2px solid var(--tone);background:var(--tone-soft)}
footer{margin-top:28px;font-size:12px;color:var(--muted)}
footer a{color:inherit}
.err{padding:40px 20px;text-align:center;color:var(--muted)}
.skel{background:linear-gradient(90deg,var(--chip),var(--surface),var(--chip));background-size:200% 100%;animation:sh 1.2s infinite;border-radius:20px;min-height:260px}
@keyframes sh{to{background-position:-200% 0}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">🧥 오늘 뭐 입지?</div>
    <div class="controls">
      <div class="seg" id="daySeg"><button data-d="0" class="on">오늘</button><button data-d="1">내일</button></div>
      <button class="loc" id="locBtn">📍 내 위치로</button>
    </div>
  </div>

  <div id="app">
    <div class="hero"><div class="skel"></div><div class="skel"></div></div>
  </div>

  <footer>
    데이터: 기상청 초단기실황·단기예보, 에어코리아 (k-skill-proxy 경유) · 체감온도는 기상청 겨울철 체감온도식으로 계산 · <span id="fetched"></span>
  </footer>
</div>

<script>
const $ = s => document.querySelector(s);
const DEFAULT_NAME = "SK남산빌딩";
const state = { data:null, day:0, coords:null };

// 기온별 옷차림 (체감 기준 하한)
const BANDS = [
  { min:28, label:"28° 이상", head:"한여름 — 최대한 시원하게", outer:["—","겉옷 없이"], top:["👕","민소매·반팔"], bottom:["🩳","반바지·린넨 팬츠"], acc:["🕶️","선글라스·손풍기"] },
  { min:23, label:"23~27°", head:"반팔이면 충분해요", outer:["—","겉옷 없이"], top:["👕","반팔·얇은 셔츠"], bottom:["👖","면바지·얇은 슬랙스"], acc:["🧢","모자"] },
  { min:20, label:"20~22°", head:"얇은 긴팔이 딱 좋아요", outer:["🧶","얇은 가디건"], top:["👔","긴팔 티·셔츠"], bottom:["👖","면바지·슬랙스"], acc:["👟","가벼운 스니커즈"] },
  { min:17, label:"17~19°", head:"가디건 하나 걸치세요", outer:["🧶","가디건·얇은 자켓"], top:["👕","맨투맨·얇은 니트"], bottom:["👖","청바지·슬랙스"], acc:["👟","스니커즈"] },
  { min:12, label:"12~16°", head:"자켓이 필요한 날", outer:["🧥","자켓·트렌치코트"], top:["🧶","니트·셔츠"], bottom:["👖","청바지·면바지"], acc:["👞","로퍼·스니커즈"] },
  { min:9,  label:"9~11°",  head:"트렌치에 레이어드", outer:["🧥","트렌치·야상"], top:["🧶","니트 + 셔츠 레이어드"], bottom:["👖","도톰한 슬랙스"], acc:["🧣","얇은 스카프"] },
  { min:5,  label:"5~8°",   head:"코트 꺼낼 시간", outer:["🧥","울 코트·가죽 자켓"], top:["🧶","니트 + 히트텍"], bottom:["👖","두꺼운 바지"], acc:["🧣","목도리"] },
  { min:-99,label:"4° 이하", head:"패딩 필수, 단단히 무장", outer:["🥼","롱패딩·두꺼운 코트"], top:["🧶","기모 니트 + 히트텍"], bottom:["👖","기모 바지"], acc:["🧤","목도리·장갑"] },
];
const bandOf = t => BANDS.find(b => t >= b.min);

function feels(t, wsd){ // 기상청 겨울철 체감온도 (10°C 이하, 풍속 1.3m/s 이상)
  if (t == null) return null;
  const v = (wsd || 0) * 3.6;
  if (t > 10 || v < 4.8) return t;
  return 13.12 + 0.6215*t - 11.37*Math.pow(v,0.16) + 0.3965*t*Math.pow(v,0.16);
}
function skyIcon(h, hour){
  const pty = +h.pty || 0;
  if (pty===1||pty===5) return "🌧️"; if (pty===2||pty===6) return "🌨️"; if (pty===3||pty===7) return "❄️"; if (pty===4) return "🌦️";
  const night = hour < 7 || hour >= 18;
  return ({1: night?"🌙":"☀️", 3:"⛅", 4:"☁️"})[+h.sky] || (night?"🌙":"☀️");
}
function skyText(h){
  const pty = +h.pty || 0;
  if (pty) return ({1:"비",2:"비/눈",3:"눈",4:"소나기",5:"빗방울",6:"빗방울/눈날림",7:"눈날림"})[pty] || "강수";
  return ({1:"맑음",3:"구름 많음",4:"흐림"})[+h.sky] || "맑음";
}
const r = n => n==null ? "–" : Math.round(n);
const hh = t => +String(t).slice(0,2);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ymd = d => `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`;

function pmGrade(v, kind){
  if (v==null) return null;
  const c = kind==="pm10" ? [30,80,150] : [15,35,75];
  return v<=c[0] ? "좋음" : v<=c[1] ? "보통" : v<=c[2] ? "나쁨" : "매우나쁨";
}
function nearest(hours, hour){ // 해당 시각에 가장 가까운 예보
  return hours.reduce((best,h)=> !best || Math.abs(hh(h.time)-hour) < Math.abs(hh(best.time)-hour) ? h : best, null);
}

function analyze(day, isToday){
  const hours = day.hours;
  const at = hour => { const h = nearest(hours, hour); return h ? {...h, f:feels(h.tmp, h.wsd)} : null; };
  const m = at(8), n = at(12), e = at(18);
  const fs = [m,n,e].filter(Boolean).map(x=>x.f);
  const avg = fs.reduce((a,b)=>a+b,0)/fs.length;
  const cold = Math.min(...fs), warm = Math.max(...fs);
  const band = bandOf(avg);
  const outerBand = bandOf(cold);

  const active = hours.filter(h => hh(h.time) >= 7 && hh(h.time) <= 20);
  const maxPop = Math.max(0, ...active.map(h=>+h.pop||0));
  const rainy = active.filter(h => +h.pty>0);
  const snowy = active.some(h => [2,3,6,7].includes(+h.pty));
  const maxWind = Math.max(0, ...active.map(h=>+h.wsd||0));
  const spread = (day.tmx ?? warm) - (day.tmn ?? cold);
  const sunny = active.filter(h => +h.sky===1 && !+h.pty).length >= active.length/2;

  const tips = [];
  if (rainy.length || maxPop >= 60){
    const first = rainy[0] || active.find(h=>+h.pop>=60);
    tips.push({e:"☂️", t:`<b>장우산</b> 챙기세요 · ${first?hh(first.time)+"시경 ":""}강수확률 ${maxPop}%`, warn:true});
  } else if (maxPop >= 30) tips.push({e:"🌂", t:`<b>접이식 우산</b> 가방에 · 강수확률 최대 ${maxPop}%`, warn:true});
  if (snowy) tips.push({e:"🥾", t:"<b>미끄럼 방지 신발</b> — 눈 소식", warn:true});
  if (spread >= 10) tips.push({e:"🔁", t:`일교차 <b>${r(spread)}°</b> — 벗고 입기 쉬운 겉옷`, warn:true});
  if (maxWind >= 7) tips.push({e:"🌬️", t:`바람 <b>${maxWind}m/s</b> — 바람막이·모자 고정`, warn:true});
  else if (maxWind >= 4) tips.push({e:"🍃", t:`바람이 약간 불어요 (${maxWind}m/s)`});
  if (sunny && (day.tmx ?? 0) >= 25) tips.push({e:"🧴", t:"<b>자외선 차단제</b> 필수"});
  if ((day.tmn ?? 99) <= 0) tips.push({e:"🧤", t:"<b>장갑·핫팩</b> — 영하권 아침"});
  const dust = isToday && state.data.dust;
  if (dust){
    const g10 = pmGrade(dust.pm10,"pm10"), g25 = pmGrade(dust.pm25,"pm25");
    const bad = [g10,g25].some(g => g==="나쁨"||g==="매우나쁨");
    tips.push({e: bad?"😷":"🍀", t: bad ? `<b>KF94 마스크</b> · 미세먼지 ${g10||"–"} / 초미세 ${g25||"–"}` : `공기 깨끗해요 · 미세 ${g10||"–"} / 초미세 ${g25||"–"}`, warn:bad});
  }
  if (!tips.length) tips.push({e:"👌", t:"특별히 챙길 건 없어요"});

  // 한 줄 요약
  const parts = [];
  if (m && e) parts.push(`출근길 체감 ${r(m.f)}°, 낮 ${r(n?.f)}°, 퇴근길 ${r(e.f)}°`);
  if (warm - cold >= 6) parts.push("아침저녁이 꽤 쌀쌀하니 겉옷은 꼭 챙기세요");
  else parts.push("하루 종일 기온 변화가 크지 않아요");

  // 겉옷은 가장 추운 시간(보통 출근길) 기준
  const colderOuter = outerBand !== band && outerBand.outer[0] !== "—";
  const outer = colderOuter ? outerBand.outer : band.outer;
  const outerKey = colderOuter ? `아우터 · 체감 ${r(cold)}° 기준` : "아우터";
  return { band, outer, outerKey, m, n, e, tips, summary: parts.join(". ") + "." };
}

function render(){
  const d = state.data; if (!d) return;
  const day = d.days[state.day] || d.days[0];
  if (!day){ $("#app").innerHTML = `<div class="card err">예보 데이터가 아직 없어요. 잠시 후 다시 시도해 주세요.</div>`; return; }
  const isToday = day.date === ymd(new Date());
  const a = analyze(day, isToday);

  const nowHour = new Date().getHours();
  const cur = isToday && d.now ? { tmp:d.now.temp, wsd:d.now.wsd, pty:d.now.pty, sky: nearest(day.hours, nowHour)?.sky, reh:d.now.reh }
                               : { ...nearest(day.hours, 12) };
  const curF = feels(cur.tmp, cur.wsd);
  const tt = cur.tmp ?? 15; // 추우면 파랑, 선선하면 호박색, 더우면 코랄
  document.documentElement.style.setProperty("--hue", tt < 12 ? 214 : tt < 20 ? 36 : 14);

  const dayLabel = isToday ? "지금" : "내일 정오";
  const maxPop = Math.max(0, ...day.hours.map(h=>+h.pop||0));

  $("#app").innerHTML = `
  <div class="hero">
    <section class="card weather">
      <div class="place">📍 ${esc(d.location.name)} · ${dayLabel}</div>
      <div class="big"><span class="icon">${skyIcon(cur, isToday?nowHour:12)}</span><span class="temp">${r(cur.tmp)}<small>°</small></span></div>
      <div class="desc">${skyText(cur)} · 체감 ${r(curF)}°</div>
      <div class="range"><span class="lo">최저 <b>${r(day.tmn)}°</b></span><span class="hi">최고 <b>${r(day.tmx)}°</b></span></div>
      <div class="stats">
        <div class="stat">습도<b>${r(cur.reh)}%</b></div>
        <div class="stat">바람<b>${cur.wsd ?? "–"}m/s</b></div>
        <div class="stat">강수확률<b>${maxPop}%</b></div>
      </div>
    </section>
    <section class="card outfit">
      <h2>${isToday?"오늘의":"내일의"} 코디 · ${a.band.label}</h2>
      <p class="headline">${a.band.head}</p>
      <p class="summary">${a.summary}</p>
      <div class="items">
        ${[[a.outerKey,a.outer],["상의",a.band.top],["하의",a.band.bottom],["소품",a.band.acc]].map(([k,[e,v]])=>`
          <div class="item"><span class="e">${e==="—"?"🙅":e}</span><div><div class="k">${k}</div><div class="v">${v}</div></div></div>`).join("")}
      </div>
    </section>
  </div>

  <div class="tips">${a.tips.map(t=>`<div class="tip ${t.warn?"warn":""}"><span>${t.e}</span><span>${t.t}</span></div>`).join("")}</div>

  <div class="sec-title">출근 · 점심 · 퇴근</div>
  <div class="moments">
    ${[["🚶 출근 8시",a.m,8],["🍱 점심 12시",a.n,12],["🏠 퇴근 18시",a.e,18]].map(([w,h,hr])=> h ? `
      <div class="card moment"><div class="when">${w}</div><div class="e">${skyIcon(h,hr)}</div>
      <div class="t">${r(h.tmp)}°</div><div class="f">체감 ${r(h.f)}° · ${skyText(h)}${+h.pop?` · ☔${h.pop}%`:""}</div></div>` : `<div class="card moment"><div class="when">${w}</div><div class="f">예보 없음</div></div>`).join("")}
  </div>

  <div class="sec-title">시간별 날씨</div>
  <div class="card hourly">
    ${day.hours.filter(h => !isToday || hh(h.time) >= nowHour).map(h=>{ const H=hh(h.time); return `
      <div class="h ${isToday&&H===nowHour?"now":""}"><div>${isToday&&H===nowHour?"지금":H+"시"}</div><div class="e">${skyIcon(h,H)}</div>
      <div class="t">${r(h.tmp)}°</div><div class="p">${+h.pop?h.pop+"%":""}</div></div>`;}).join("")}
  </div>

  <div class="sec-title">기온별 옷차림 가이드</div>
  <div class="guide">
    ${BANDS.map(b=>`<div class="g ${b===a.band?"on":""}"><b>${b.label}</b>${[b.outer,b.top,b.bottom].map(x=>x[1]).filter(x=>x!=="겉옷 없이").join(", ")}</div>`).join("")}
  </div>`;

  // 오늘 날짜가 없으면 '오늘' 버튼 비활성
  [...document.querySelectorAll("#daySeg button")].forEach((b,i)=>{ b.classList.toggle("on", i===state.day); b.disabled = !d.days[i]; });
  const t = new Date(d.fetchedAt);
  $("#fetched").textContent = `${t.toLocaleString("ko-KR",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})} 조회`;
}

async function load(){
  const q = state.coords ? `?lat=${state.coords.lat}&lon=${state.coords.lon}` : "";
  try{
    const res = await fetch(`/api/weather${q}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.status);
    state.data = data;
    if (new Date().getHours() >= 20 && data.days[1] && state.day===0 && !state.touched) state.day = 1; // 밤에는 내일 코디
    render();
  }catch(e){
    $("#app").innerHTML = `<div class="card err">날씨를 불러오지 못했어요 😢<br><small>${esc(e.message)}</small></div>`;
  }
}

$("#daySeg").addEventListener("click", e => { const b = e.target.closest("button"); if(!b || b.disabled) return; state.day = +b.dataset.d; state.touched = true; render(); });
$("#locBtn").addEventListener("click", () => {
  if (state.coords){ state.coords = null; $("#locBtn").textContent = "📍 내 위치로"; load(); return; }
  if (!navigator.geolocation) return alert("이 브라우저는 위치 기능을 지원하지 않아요.");
  $("#locBtn").textContent = "위치 확인 중…";
  navigator.geolocation.getCurrentPosition(p => {
    state.coords = { lat:p.coords.latitude.toFixed(4), lon:p.coords.longitude.toFixed(4) };
    $("#locBtn").textContent = `🏢 ${DEFAULT_NAME} 기준으로`;
    load();
  }, () => { $("#locBtn").textContent = "📍 내 위치로"; alert("위치 권한이 없어 기본 위치(SK남산빌딩)로 보여드려요."); }, { timeout:8000 });
});
load();
</script>
</body>
</html>
